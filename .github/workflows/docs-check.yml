name: Docs Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify-documents:
    name: Verify documents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify product documents
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -NonInteractive -File ./scripts/verify-docs.ps1
