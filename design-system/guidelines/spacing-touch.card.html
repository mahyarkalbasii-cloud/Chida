<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><script>(function(){var q=location.search||'',b='../';window.CHIDA_ICON_BASE=b+'assets/icons';window.CHIDA_ASSET_QUERY=q;
var list=['tokens/fonts.css','tokens/colors.css','tokens/typography.css','tokens/spacing.css','tokens/radius.css','tokens/elevation.css','tokens/motion.css','tokens/grid.css','tokens/base.css'];
function abs(p){return new URL(p,location.href).href}
function put(t,base){var st=document.createElement('style');st.textContent=t.replace(/url\((["']?)([^"')]+)\1\)/g,function(m,x,u){return /^(data:|https?:)/.test(u)?m:'url("'+new URL(u,base).href+q+'")'});document.head.appendChild(st)}
(function next(i){if(i>=list.length)return;var p=b+list[i],base=abs(p);fetch(base+q).then(function(r){return r.ok?r.text():''}).then(function(t){put(t,base);next(i+1)}).catch(function(){next(i+1)})})(0);})();</script>
<style>body{margin:0;padding:20px;box-sizing:border-box;background:var(--bg-canvas);min-height:170px;font-family:var(--font-fa)}
.k{font-size:11px;line-height:14px;color:var(--text-tertiary);letter-spacing:.03em;direction:ltr;text-align:right}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:46px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}
.g{display:grid;gap:12px}.row{display:flex;gap:12px}.b{font-weight:600}</style></head><body><div class="row" style="align-items:flex-end;gap:16px">
<div class="sw"><div style="width:120px;height:48px;border:1px dashed var(--accent);border-radius:var(--radius-control);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-secondary)">۴۸ حداقل</div><div class="k">--touch-min</div></div>
<div class="sw"><div style="width:160px;height:52px;background:var(--accent);color:var(--on-accent);border-radius:var(--radius-control);display:flex;align-items:center;justify-content:center;font-weight:600">دکمه اصلی</div><div class="k">--button-height 52</div></div>
<div class="sw"><div style="width:200px;height:52px;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-control);display:flex;align-items:center;padding:0 12px;color:var(--text-tertiary)">فیلد متن</div><div class="k">--field-height 52</div></div>
<div class="sw"><div style="width:120px;height:56px;background:var(--bg-subtle);border-radius:var(--radius-control);display:flex;align-items:center;justify-content:center;font-size:13px">هدر</div><div class="k">--header-height 56</div></div>
</div></body></html>
