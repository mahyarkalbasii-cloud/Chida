<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><script>(function(){var q=location.search||'',b='../';window.CHIDA_ICON_BASE=b+'assets/icons';window.CHIDA_ASSET_QUERY=q;
var list=['tokens/fonts.css','tokens/colors.css','tokens/typography.css','tokens/spacing.css','tokens/radius.css','tokens/elevation.css','tokens/motion.css','tokens/grid.css','tokens/base.css'];
function abs(p){return new URL(p,location.href).href}
function put(t,base){var st=document.createElement('style');st.textContent=t.replace(/url\((["']?)([^"')]+)\1\)/g,function(m,x,u){return /^(data:|https?:)/.test(u)?m:'url("'+new URL(u,base).href+q+'")'});document.head.appendChild(st)}
(function next(i){if(i>=list.length)return;var p=b+list[i],base=abs(p);fetch(base+q).then(function(r){return r.ok?r.text():''}).then(function(t){put(t,base);next(i+1)}).catch(function(){next(i+1)})})(0);})();</script>
<style>body{margin:0;padding:20px;box-sizing:border-box;background:var(--bg-canvas);min-height:190px;font-family:var(--font-fa)}
.k{font-size:11px;line-height:14px;color:var(--text-tertiary);letter-spacing:.03em;direction:ltr;text-align:right}
.sw{display:flex;flex-direction:column;gap:6px}.chip{height:46px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}
.g{display:grid;gap:12px}.row{display:flex;gap:12px}.b{font-weight:600}</style></head><body><div data-theme="dark" style="background:var(--bg-canvas);margin:-20px;padding:20px"><div class="g" style="grid-template-columns:repeat(4,1fr)">
<div class="sw"><div class="chip" style="background:var(--bg-canvas)"></div><div class="k">بوم<br>--bg-canvas</div></div><div class="sw"><div class="chip" style="background:var(--bg-surface)"></div><div class="k">سطح کارت<br>--bg-surface</div></div><div class="sw"><div class="chip" style="background:var(--bg-subtle)"></div><div class="k">سطح ملایم<br>--bg-subtle</div></div><div class="sw"><div class="chip" style="background:var(--bg-inset)"></div><div class="k">فرورفته<br>--bg-inset</div></div><div class="sw"><div class="chip" style="background:var(--text-primary)"></div><div class="k">متن اصلی<br>--text-primary</div></div><div class="sw"><div class="chip" style="background:var(--text-secondary)"></div><div class="k">متن فرعی<br>--text-secondary</div></div><div class="sw"><div class="chip" style="background:var(--text-tertiary)"></div><div class="k">متن کم‌رنگ<br>--text-tertiary</div></div><div class="sw"><div class="chip" style="background:var(--border-subtle)"></div><div class="k">خط موی نازک<br>--border-subtle</div></div><div class="sw"><div class="chip" style="background:var(--border-default)"></div><div class="k">خط پیش‌فرض<br>--border-default</div></div><div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="k">اکسنت<br>--accent</div></div><div class="sw"><div class="chip" style="background:var(--accent-subtle)"></div><div class="k">اکسنت ملایم<br>--accent-subtle</div></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="k">خطا<br>--danger</div></div>
</div></div></body></html>
