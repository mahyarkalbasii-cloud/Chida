<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Feedback</title>
<script>(function(){var q=location.search||'',b='../../';window.CHIDA_ICON_BASE=b+'assets/icons';window.CHIDA_ASSET_QUERY=q;
var list=['tokens/fonts.css','tokens/colors.css','tokens/typography.css','tokens/spacing.css','tokens/radius.css','tokens/elevation.css','tokens/motion.css','tokens/grid.css','tokens/base.css'];
function abs(p){return new URL(p,location.href).href}
function put(t,base){var st=document.createElement('style');st.textContent=t.replace(/url\((["']?)([^"')]+)\1\)/g,function(m,x,u){return /^(data:|https?:)/.test(u)?m:'url("'+new URL(u,base).href+q+'")'});document.head.appendChild(st)}
(function next(i){if(i>=list.length)return;var p=b+list[i],base=abs(p);fetch(base+q).then(function(r){return r.ok?r.text():''}).then(function(t){put(t,base);next(i+1)}).catch(function(){next(i+1)})})(0);})();</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

</head><body><div id="root"></div>
<script type="text/babel">
const { InlineBanner, Spinner, SuccessState, Button } = window.CHIDADesignSystem_4f968e;
function Demo(){return (
  <div style={{display:'grid',gridTemplateColumns:'1.1fr .9fr',gap:20,alignItems:'start'}}>
    <div className="col">
      <InlineBanner tone="error" title="ارسال کد انجام نشد">چند لحظه دیگر دوباره تلاش کنید.</InlineBanner>
      <InlineBanner tone="offline" title="اتصال اینترنت برقرار نیست" action={<Button size="sm" variant="secondary" iconStart="refresh-cw">تلاش دوباره</Button>}>وقتی شبکه برگردد، ادامه می‌دهیم.</InlineBanner>
      <InlineBanner tone="info" title="کد دعوت لازم است">حساب سازنده فقط با دعوت ساخته می‌شود.</InlineBanner>
      <div className="row" style={{gap:20,paddingTop:4}}>
        <span className="lbl">Spinner</span>
        <Spinner size={16}/><Spinner size={20}/><Spinner size={28}/>
      </div>
    </div>
    <SuccessState title="حساب شما ساخته شد" description="حالا اولین پروژه‌تان را تعریف کنید." style={{padding:'8px 0'}}>
      <Button variant="primary" fullWidth>ساخت پروژه</Button>
    </SuccessState>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
