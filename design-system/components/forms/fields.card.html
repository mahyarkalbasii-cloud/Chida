<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>Fields</title>
<script>(function(){var q=location.search||'',b='../../';window.CHIDA_ICON_BASE=b+'assets/icons';window.CHIDA_ASSET_QUERY=q;
var list=['tokens/fonts.css','tokens/colors.css','tokens/typography.css','tokens/spacing.css','tokens/radius.css','tokens/elevation.css','tokens/motion.css','tokens/grid.css','tokens/base.css'];
function abs(p){return new URL(p,location.href).href}
function put(t,base){var st=document.createElement('style');st.textContent=t.replace(/url\((["']?)([^"')]+)\1\)/g,function(m,x,u){return /^(data:|https?:)/.test(u)?m:'url("'+new URL(u,base).href+q+'")'});document.head.appendChild(st)}
(function next(i){if(i>=list.length)return;var p=b+list[i],base=abs(p);fetch(base+q).then(function(r){return r.ok?r.text():''}).then(function(t){put(t,base);next(i+1)}).catch(function(){next(i+1)})})(0);})();</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{background:var(--bg-canvas);margin:0;padding:20px;box-sizing:border-box}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.lbl{font-size:11px;line-height:16px;color:var(--text-tertiary);letter-spacing:.04em}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { TextField, PhoneField, InviteCodeField, OtpInput, Checkbox, FieldMessage } = window.CHIDADesignSystem_4f968e;
function Demo(){
  const [phone,setPhone]=React.useState('09123456789');
  const [code,setCode]=React.useState('CHD-4K9P');
  const [otp,setOtp]=React.useState('0491');
  const [agree,setAgree]=React.useState(true);
  return (
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px 24px'}}>
    <TextField label="نام پروژه" placeholder="مثلاً برج مسکونی نیلوفر" hint="این نام را فقط شما می‌بینید." />
    <TextField label="نام فروشگاه" defaultValue="آهن‌آلات کاوه" error="این نام قبلاً ثبت شده است." />
    <PhoneField value={phone} onChange={setPhone} hint="کد تأیید به همین شماره پیامک می‌شود." />
    <InviteCodeField value={code} onChange={setCode} loading />
    <TextField label="کد پستی" ltr placeholder="1234567890" disabled hint="پس از تأیید نشانی فعال می‌شود." />
    <OtpInput value={otp} onChange={setOtp} label="کد تأیید" hint="کد ۶ رقمی پیامک‌شده را وارد کنید." />
    <Checkbox checked={agree} onChange={setAgree}>شرایط استفاده و حریم خصوصی چیدا را می‌پذیرم.</Checkbox>
    <div className="col" style={{gap:4}}>
      <FieldMessage>راهنما: متن کمکی خنثی زیر فیلد.</FieldMessage>
      <FieldMessage tone="error">شماره موبایل ۱۱ رقم و با ۰۹ شروع می‌شود.</FieldMessage>
    </div>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
